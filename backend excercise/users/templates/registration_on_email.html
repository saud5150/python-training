<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome to the Platform</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        .header { background: #4a90e2; color: #fff; padding: 10px 0; text-align: center; border-radius: 8px 8px 0 0; }
        .footer { margin-top: 20px; font-size: 0.9em; color: #888; text-align: center; }
        .credentials { background: #f9f9f9; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Welcome to the Platform</h2>
        </div>
        <p>Hi {{ user.name }},</p>
        <p>You have been registered as a <strong>{{ role }}</strong>.</p>
        <div class="credentials">
            <p><strong>Your login credentials:</strong></p>
            <p>Email: <strong>{{ user.email }}</strong></p>
            <p>Password: <strong>{{ password }}</strong></p>
        </div>
        <p>Thank you,<br/>The Team</p>
        <div class="footer">
            &copy; {{ year }} The Platform. All rights reserved.
        </div>
    </div>
</body>
</html>
